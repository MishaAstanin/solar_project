{% extends "base.html" %}

{% load static %}

{% block page_title %}
    Построение
{% endblock %}

{% block page_css %}
    <link rel="stylesheet" href="{% static 'search.css' %}">
    <link rel="stylesheet" href="{% static 'plots.css' %}"> 
{% endblock %}

{% block page_head_js %}
    <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
{% endblock %}

{% block page %}
<div id="plots-container">
    <div class="plot-loader-container">
        <div class="spinner"></div>
        <h2>Строим графики...</h2>
        <p style="color: #666;">Пожалуйста, не закрывайте страницу...</p>
    </div>
</div>
{% endblock %}

{% block page_js %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById('plots-container');
    const postPayload = "{{ raw_post_data|escapejs }}";

    fetch("{% url 'get_plot_data_api' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: postPayload
    })
    .then(async response => {
        const text = await response.text();
        if (!response.ok) throw new Error(text || 'Ошибка сервера при генерации графиков');
        return text;
    })
    .then(html => {
        container.innerHTML = '';
        const fragment = document.createRange().createContextualFragment(html);
        container.appendChild(fragment);
    })
    .catch(error => {
        container.innerHTML = `<div style="color:red; text-align:center; padding: 40px;">${error.message}</div>`;
    });
});
</script>
{% endblock %}
